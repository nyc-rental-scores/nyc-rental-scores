name: Refresh listings and publish site

on:
  schedule:
    - cron: '17 * * * *'   # every hour
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Grade new listings
        env:
          LISTINGS_CSV_URL: ${{ vars.LISTINGS_CSV_URL }}
          SODA_APP_TOKEN: ${{ secrets.SODA_APP_TOKEN }}
        run: node scripts/update-listings.mjs

      - name: Save updated data
        run: |
          git config user.name "rental-scores-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || (git commit -m "Refresh listings $(date -u +%Y-%m-%dT%H:%MZ)" && git push)

      - name: Assemble site
        run: cp -r scoring site/scoring

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
